  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_NET
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-basic\"

[env:esp32_net_runtime]
lib_deps =
  WiFi
  DNSServer
  ESPmDNS
