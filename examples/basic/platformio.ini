[platformio]
default_envs = esp32_minimal

[env]
platform = platformio/espressif32@6.7.0
board = esp32dev
framework = arduino
lib_extra_dirs = ../..
board_build.partitions = ../../partitions/esp32-4mb-ota-balanced.csv
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
build_src_filter =
  +<*>
  -<deps_*.cpp>

[esp32base_builtin_include_paths]
build_flags =
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/AsyncUDP/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/DNSServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/ESPmDNS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Hash/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/LittleFS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Preferences/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Update/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WebServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[esp32base_size_flags]
build_flags =
  -fno-exceptions
  -flto

[esp32base_minimal]
lib_ldf_mode = off
lib_deps =
  Preferences
  symlink://../..
build_flags =
  ${esp32base_builtin_include_paths.build_flags}
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_MINIMAL
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-basic\"

[esp32base_offline]
lib_ldf_mode = off
lib_deps =
  Preferences
  FS
  LittleFS
  symlink://../..
build_src_filter =
  +<*>
  -<deps_*.cpp>
  +<deps_offline.cpp>
build_flags =
  ${esp32base_builtin_include_paths.build_flags}
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_OFFLINE
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-basic\"

[esp32base_local]
lib_deps =
  WiFi
  DNSServer
  ESPmDNS
  LittleFS
  WebServer
  Update
build_src_filter =
  +<*>
  -<deps_*.cpp>
  +<deps_local.cpp>
build_flags =
  ${esp32base_builtin_include_paths.build_flags}
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_LOCAL
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-basic\"
  -D ESP32BASE_OTA_REQUIRE_MARK_VALID=1

[esp32base_iot]
lib_deps =
  WiFi
  DNSServer
  ESPmDNS
  LittleFS
  WebServer
  Update
build_src_filter =
  +<*>
  -<deps_*.cpp>
  +<deps_iot.cpp>
build_flags =
  ${esp32base_builtin_include_paths.build_flags}
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_IOT
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-basic\"
  -D ESP32BASE_OTA_REQUIRE_MARK_VALID=1

[pioarduino_core3_packages]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz

[env:esp32_minimal]
extends = esp32base_minimal

[env:esp32_offline]
extends = esp32base_offline

[env:esp32_local]
extends = esp32base_local

[env:esp32_iot]
extends = esp32base_iot

[env:esp32s3_minimal]
extends = esp32base_minimal
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv

[env:esp32s3_offline]
extends = esp32base_offline
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv

[env:esp32s3_local]
extends = esp32base_local
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv

[env:esp32s3_iot]
extends = esp32base_iot
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv

[env:esp32c3_minimal]
extends = esp32base_minimal
board = esp32-c3-devkitm-1
board_build.partitions = ../../partitions/esp32-c3-4mb-ota-balanced.csv

[env:esp32c3_offline]
extends = esp32base_offline
board = esp32-c3-devkitm-1
board_build.partitions = ../../partitions/esp32-c3-4mb-ota-balanced.csv

[env:esp32c3_local]
extends = esp32base_local
board = esp32-c3-devkitm-1
board_build.partitions = ../../partitions/esp32-c3-4mb-ota-balanced.csv

[env:esp32c3_iot]
extends = esp32base_iot
board = esp32-c3-devkitm-1
board_build.partitions = ../../partitions/esp32-c3-4mb-ota-balanced.csv

[env:esp32_minimal_arduino3]
extends = esp32base_minimal
platform = ${pioarduino_core3_packages.platform}
platform_packages = ${pioarduino_core3_packages.platform_packages}
extra_scripts = pre:../../scripts/pioarduino_core3_preflight.py

[env:esp32_offline_arduino3]
extends = esp32base_offline
platform = ${pioarduino_core3_packages.platform}
platform_packages = ${pioarduino_core3_packages.platform_packages}
extra_scripts = pre:../../scripts/pioarduino_core3_preflight.py

[env:esp32_local_arduino3]
extends = esp32base_local
platform = ${pioarduino_core3_packages.platform}
platform_packages = ${pioarduino_core3_packages.platform_packages}
extra_scripts = pre:../../scripts/pioarduino_core3_preflight.py

[env:esp32_iot_arduino3]
extends = esp32base_iot
platform = ${pioarduino_core3_packages.platform}
platform_packages = ${pioarduino_core3_packages.platform_packages}
extra_scripts = pre:../../scripts/pioarduino_core3_preflight.py
