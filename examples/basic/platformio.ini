[platformio]
default_envs = esp32_core

[env]
platform = platformio/espressif32@6.7.0
board = esp32dev
framework = arduino
lib_extra_dirs = ../..
board_build.partitions = ../../partitions/esp32-4mb-ota-balanced.csv
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
build_src_filter =
  +<*>
  -<deps_*.cpp>

[esp32base_builtin_include_paths]
build_flags =
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/ArduinoOTA/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/AsyncUDP/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/DNSServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/ESPmDNS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Hash/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/LittleFS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Preferences/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Update/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WebServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[esp32base_size_flags]
build_flags =
  -fno-exceptions
  -flto

[pioarduino_core3_packages]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz

[env:esp32_core]
lib_ldf_mode = off
lib_deps =
  Preferences
  symlink://../..
build_flags =
  ${esp32base_builtin_include_paths.build_flags}
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_CORE
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-basic\"

[env:esp32_runtime]
lib_deps =
  LittleFS
build_src_filter =
  +<*>
  -<deps_*.cpp>
  +<deps_runtime.cpp>
build_flags =
  ${esp32base_builtin_include_paths.build_flags}
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_RUNTIME
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-basic\"

[env:esp32_net]
lib_deps =
  WiFi
  DNSServer
  ESPmDNS
build_src_filter =
  +<*>
  -<deps_*.cpp>
  +<deps_net.cpp>
build_flags =
