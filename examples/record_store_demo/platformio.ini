[platformio]
default_envs = esp32

[pioarduino_core3_packages]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz

[env]
platform = platformio/espressif32@6.7.0
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..
lib_deps =
  LittleFS
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
build_flags =
  -fno-exceptions
  -flto
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_CORE
  -D ESP32BASE_ENABLE_FS=1
  -D ESP32BASE_ENABLE_RECORD_STORE=1
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-records\"
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/LittleFS/src

[env:esp32]
board = esp32dev
board_build.partitions = ../../partitions/esp32-4mb-ota-balanced.csv

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = ../../partitions/esp32-c3-4mb-ota-balanced.csv

[env:esp32_arduino3]
extends = env:esp32
platform = ${pioarduino_core3_packages.platform}
platform_packages = ${pioarduino_core3_packages.platform_packages}
extra_scripts = pre:../../scripts/pioarduino_core3_preflight.py
