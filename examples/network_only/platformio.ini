[platformio]
default_envs = esp32

# Atypical networked node without a maintenance plane:
# OFFLINE profile plus explicit WiFi/DNS/NTP/mDNS overrides, no Web and no OTA.
# This is the documented capability-override combination; no fifth profile.
# One firmware per chip; select the board explicitly, e.g. -e esp32c3.

[esp32base_size_flags]
build_flags =
  -fno-exceptions
  -flto

[env]
platform = platformio/espressif32@6.7.0
framework = arduino
monitor_speed = 115200
board_build.partitions = ../../partitions/esp32-4mb-ota-balanced.csv
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
lib_deps =
  Preferences
  FS
  ESP32 Async UDP
  symlink://../..
  WiFi
  DNSServer
  ESPmDNS
  LittleFS
build_flags =
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_OFFLINE
  -D ESP32BASE_ENABLE_WIFI=1
  -D ESP32BASE_ENABLE_DNS=1
  -D ESP32BASE_ENABLE_NTP=1
  -D ESP32BASE_ENABLE_MDNS=1
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-network\"

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = ../../partitions/esp32-c3-4mb-ota-balanced.csv
