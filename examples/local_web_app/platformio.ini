[platformio]
default_envs = esp32

# LOCAL profile business web application:
# business pages/APIs, App Config with every field type, validation and
# callbacks, CSV export, custom home navigation and a Sleep entry point.
# One firmware per chip; select the board explicitly, e.g. -e esp32c3.

[esp32base_size_flags]
build_flags =
  -fno-exceptions
  -flto

[env]
platform = platformio/espressif32@6.7.0
framework = arduino
monitor_speed = 115200
board_build.partitions = ../../partitions/esp32-4mb-ota-balanced.csv
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
extra_scripts =
  post:../../scripts/esp32base_webota.py
lib_deps =
  Preferences
  FS
  ESP32 Async UDP
  symlink://../..
  WiFi
  DNSServer
  ESPmDNS
  LittleFS
  WebServer
  Update
build_flags =
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_LOCAL
  -D ESP32BASE_ENABLE_SLEEP=1
  -D ESP32BASE_ENABLE_APP_CONFIG=1
  -D ESP32BASE_APP_CONFIG_MAX_GROUPS=3
  -D ESP32BASE_APP_CONFIG_MAX_FIELDS=12
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-web-app\"
  -D ESP32BASE_LOG_LEVEL=ESP32BASE_LOG_DEBUG
  ${sysenv.ESP32BASE_LOCAL_WEB_APP_EXTRA_FLAGS}

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = ../../partitions/esp32-c3-4mb-ota-balanced.csv
