[platformio]
default_envs = esp32

# MINIMAL profile plus the orthogonal half-duplex RS485 serial port helper.
# It is not Modbus: framing, CRC, addressing, retries and protocol semantics
# stay in the application. Default pins target classic ESP32; remap them in
# src/main.cpp for other boards.

[esp32base_size_flags]
build_flags =
  -fno-exceptions
  -flto

[env]
platform = platformio/espressif32@6.7.0
board = esp32dev
framework = arduino
lib_ldf_mode = off
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
lib_deps =
  Preferences
  symlink://../..
build_flags =
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_MINIMAL
  -D ESP32BASE_ENABLE_RS485_PORT=1
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-rs485\"

[env:esp32]
