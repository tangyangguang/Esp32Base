[platformio]
default_envs = esp32_mqtt_tls

[env]
platform = platformio/espressif32@6.7.0
framework = arduino
lib_extra_dirs = ../..
board_build.partitions = ../../partitions/esp32-4mb-ota-balanced.csv
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
lib_deps =
  WiFi
  DNSServer
  ESPmDNS
  LittleFS
  symlink://../..
build_flags =
  -fno-exceptions
  -flto
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_IOT
  -D ESP32BASE_ENABLE_MQTT=1
  ; Official precompiled Arduino Core 2.0.16/3.3.8 validates the CA chain
  ; and hostname but is built without X.509 notBefore/notAfter checks.
  ; This explicit opt-in is required until the Core enables that check.
  -D ESP32BASE_MQTT_ALLOW_UNCHECKED_CERTIFICATE_DATES=1
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-mqtt\"

[env:esp32_mqtt_tls]
board = esp32dev

[env:esp32_iot_explicit_deps]
board = esp32dev
lib_deps =
  WiFi
  DNSServer
  ESPmDNS
  LittleFS
  WebServer
  Update
  symlink://../..
build_flags =
  -fno-exceptions
  -flto
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_IOT
  -D ESP32BASE_ENABLE_MQTT=1
  -D ESP32BASE_MQTT_ALLOW_UNCHECKED_CERTIFICATE_DATES=1
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-mqtt\"

[env:esp32s3_mqtt_tls]
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv

[env:esp32c3_mqtt_tls]
board = esp32-c3-devkitm-1
board_build.partitions = ../../partitions/esp32-c3-4mb-ota-balanced.csv

[pioarduino_core3_packages]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz

[env:esp32_mqtt_tls_arduino3]
extends = env:esp32_mqtt_tls
platform = ${pioarduino_core3_packages.platform}
platform_packages = ${pioarduino_core3_packages.platform_packages}
extra_scripts = pre:../../scripts/pioarduino_core3_preflight.py
