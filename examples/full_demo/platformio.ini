[platformio]
default_envs = esp32_full

[esp32base_size_flags]
build_flags =
  -fno-exceptions
  -flto

[env:esp32_full]
platform = platformio/espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..
board_build.partitions = ../../partitions/esp32-4mb-ota-balanced.csv
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
extra_scripts =
  post:../../scripts/esp32base_webota.py
lib_deps =
  ArduinoOTA
  WiFi
  DNSServer
  ESPmDNS
  LittleFS
  WebServer
  Update
build_flags =
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_FULL
  -D ESP32BASE_ENABLE_APP_CONFIG=1
  -D ESP32BASE_APP_CONFIG_MAX_GROUPS=3
  -D ESP32BASE_APP_CONFIG_MAX_FIELDS=12
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-full\"
  -D ESP32BASE_LOG_LEVEL=ESP32BASE_LOG_DEBUG
  ${sysenv.ESP32BASE_FULL_DEMO_EXTRA_FLAGS}
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/ArduinoOTA/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Hash/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/DNSServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/ESPmDNS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/LittleFS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WebServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Update/src

; After the first serial upload and WiFi provisioning, command-line OTA can use:
; upload_protocol = espota
; upload_port = esp32base-full.local
; upload_flags =
;   --auth=admin
;
; Faster Esp32Base Web OTA CLI uses the existing HTTP Web OTA endpoint.
; This accepts an IP address, DNS hostname, or the Esp32Base mDNS name:
; custom_esp32base_webota_host = esp32base-full.local
; custom_esp32base_webota_user = <current-web-auth-user>
; custom_esp32base_webota_password = <current-web-auth-password>
; Run:
;   pio run -t webota

[env:esp32s3_full]
extends = env:esp32_full
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv
