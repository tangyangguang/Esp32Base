[platformio]
default_envs = esp32_web_ui_gallery

[esp32base_size_flags]
build_flags =
  -fno-exceptions
  -flto

[env:esp32_web_ui_gallery]
platform = platformio/espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..
board_build.partitions = ../../partitions/esp32-4mb-ota-balanced.csv
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
lib_deps =
  WiFi
  DNSServer
  ESPmDNS
  WebServer
build_flags =
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_WEB
  -D ESP32BASE_ENABLE_APP_CONFIG=1
  -D ESP32BASE_APP_CONFIG_MAX_GROUPS=1
  -D ESP32BASE_APP_CONFIG_MAX_FIELDS=3
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-ui\"
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/AsyncUDP/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/DNSServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/ESPmDNS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Hash/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WebServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

[env:esp32s3_web_ui_gallery]
extends = env:esp32_web_ui_gallery
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv

[env:esp32_web_ui_gallery_selftest]
extends = env:esp32_web_ui_gallery
build_flags =
  ${env:esp32_web_ui_gallery.build_flags}
  -D ESP32BASE_WEB_UI_GALLERY_SELFTEST=1
