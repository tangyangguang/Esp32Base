[platformio]
default_envs = esp32_local

[esp32base_size_flags]
build_flags =
  -fno-exceptions
  -flto

[pioarduino_core3_packages]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz

[env:esp32_local]
platform = platformio/espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..
lib_ignore = .piohome
board_build.partitions = ../../partitions/esp32-4mb-ota-balanced.csv
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
lib_deps =
  WiFi
  DNSServer
  ESPmDNS
  LittleFS
  WebServer
  Update
build_flags =
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_LOCAL
  -D ESP32BASE_ENABLE_APP_EVENTS=1
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-events\"
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Hash/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/DNSServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/ESPmDNS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/LittleFS/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WebServer/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Update/src

[env:esp32s3_local]
extends = env:esp32_local
board = esp32-s3-devkitc-1
board_build.partitions = ../../partitions/esp32-s3-8mb-ota-balanced.csv

[env:esp32c3_local]
extends = env:esp32_local
board = esp32-c3-devkitm-1
board_build.partitions = ../../partitions/esp32-c3-4mb-ota-balanced.csv

[env:esp32_local_arduino3]
extends = env:esp32_local
platform = ${pioarduino_core3_packages.platform}
platform_packages = ${pioarduino_core3_packages.platform_packages}
extra_scripts = pre:../../scripts/pioarduino_core3_preflight.py

[env:esp32_local_discrete_only]
extends = env:esp32_local
build_flags =
  ${env:esp32_local.build_flags}
  -D ESP32BASE_ENABLE_APP_EVENT_CONDITIONS=0
