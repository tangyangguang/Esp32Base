[platformio]
default_envs = esp32_rs485_port

[esp32base_size_flags]
build_flags =
  -fno-exceptions
  -flto

[pioarduino_core3_packages]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz

[env]
platform = platformio/espressif32@6.7.0
board = esp32dev
framework = arduino
lib_extra_dirs = ../..
lib_ignore = .piohome
lib_ldf_mode = off
build_unflags =
  -fno-lto
  -fuse-cxa-atexit
lib_deps =
  Preferences
  symlink://../..
build_flags =
  ${esp32base_size_flags.build_flags}
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_MINIMAL
  -D ESP32BASE_ENABLE_RS485_PORT=1
  -D ESP32BASE_DEFAULT_HOSTNAME=\"esp32base-rs485\"

[env:esp32_rs485_port]

[env:esp32_rs485_port_arduino3]
platform = ${pioarduino_core3_packages.platform}
platform_packages = ${pioarduino_core3_packages.platform_packages}
extra_scripts = pre:../../scripts/pioarduino_core3_preflight.py
