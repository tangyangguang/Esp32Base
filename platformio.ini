[platformio]
default_envs = native_web_harness

[env:native_web_harness]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -D ESP32BASE_WEB_NATIVE_TEST=1
  -D ESP32BASE_ENABLE_WEB=0
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_CORE
build_src_filter =
  -<*>
  +<web/Esp32BaseWeb.cpp>
test_filter = test_native_web_harness

[env:native_config_harness]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -D ESP32BASE_CONFIG_NATIVE_TEST=1
  -D ESP32BASE_LOG_LEVEL=ESP32BASE_LOG_NONE
  -D ESP32BASE_ENABLE_FS=1
  -D ESP32BASE_ENABLE_TIME=1
  -D ESP32BASE_ENABLE_RECORD_STORE=1
  -D ESP32BASE_ENABLE_APP_EVENTS=1
  -D ESP32BASE_ENABLE_APP_EVENT_CONDITIONS=1
  -I test/test_native_config_harness/stubs
build_src_filter =
  -<*>
  +<core/Esp32BaseConfig.cpp>
  +<core/Esp32BaseLog.cpp>
test_filter = test_native_config_harness

[env:native_time_harness]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -D ESP32BASE_TIME_NATIVE_TEST=1
  -D ESP32BASE_RTC_NATIVE_TEST=1
  -D ESP32BASE_LOG_LEVEL=ESP32BASE_LOG_NONE
  -D ESP32BASE_ENABLE_TIME=1
  -D ESP32BASE_ENABLE_RTC=1
  -I test/test_native_time_harness/stubs
build_src_filter =
  -<*>
  +<core/Esp32BaseLog.cpp>
test_filter = test_native_time_harness

[env:native_time_pcf8563_harness]
extends = env:native_time_harness
build_flags =
  ${env:native_time_harness.build_flags}
  -D ESP32BASE_RTC_DRIVER=ESP32BASE_RTC_DRIVER_PCF8563
test_filter = test_native_time_harness

[env:native_record_store_harness]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -D ESP32BASE_LOG_LEVEL=ESP32BASE_LOG_NONE
  -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_CORE
  -D ESP32BASE_ENABLE_FS=1
  -D ESP32BASE_ENABLE_RECORD_STORE=1
  -D ESP32BASE_ENABLE_APP_EVENTS=1
  -D ESP32BASE_ENABLE_TIME=1
  -I test/test_native_record_store_harness/stubs
test_filter = test_native_record_store_harness
